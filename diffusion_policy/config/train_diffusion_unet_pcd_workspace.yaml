defaults:
  - _self_
  - task: coffee_d2_goal_image_abs

name: train_diffusion_unet_pcd
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace

task_name: ${task.task_name}
shape_meta: ${task.shape_meta}
n_demos: ${task.dataset.max_train_episodes}
exp_name: "default"

n_obs_steps: 2
horizon: 16
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True
se2_augmentation: False
fix_point_num: 2048
sample_point_num: 1024
use_voxel: False

logging_extra_name: null

policy:
  _target_: diffusion_policy.policy.diffusion_unet_pcd_policy.DiffusionUnetPCDPolicy

  shape_meta: ${shape_meta}
  
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small # Yilun's paper uses fixed_small_log instead, but easy to cause Nan
    clip_sample: True # required when predict_epsilon=False
    prediction_type: epsilon # or sample

  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_pcd_obs_encoder.MultiPCDObsEncoder
    shape_meta: ${shape_meta}
    resize_shape: null
    crop_shape: [116, 116]
    # constant center crop
    random_crop: True
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    depth_model:
      _target_: diffusion_policy.model.vision.model_getter.get_depthnet
      name: resnet18
      weights: null
    pcd_model:
      _target_: diffusion_policy.model.vision.pcd_model_getter.get_pcd_net
      name: pointnext
      output_dim: 128 
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: False # the implementation is incorrect (issue#45)
    use_voxel: ${use_voxel}
    point_noise_augmentation: False
    jitter_noise_augmentation: False
    point_dropout_augmentation: False
    point_offset_augmentation: False
    point_colordrop_augmentation: False
    n_obs_steps: ${n_obs_steps}

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  # crop_shape: null
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

  # scheduler.step params
  # predict_epsilon: True


ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 5.0e-3

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 501
  gradient_accumulate_every: 1
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  use_ema: True
  freeze_encoder: False
  # training loop control
  # in epochs
  rollout_every: 250
  checkpoint_every: 250
  val_every: 10
  sample_every: 10
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${task.name}_${task_name}_${n_demos}_${logging_extra_name}
  tags: ["${task.name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: ${task.dataset_root_path}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${task.name}_${task_name}_${n_demos}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${task.name}_${task_name}_${n_demos}

hydra:
  job:
    override_dirname: ${task.name}
  run:
    dir: ${task.dataset_root_path}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${task.name}_${task_name}_${n_demos}
  sweep:
    dir: ${task.dataset_root_path}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${task.name}_${task_name}_${n_demos}
    subdir: ${hydra.job.num}
