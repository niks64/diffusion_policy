name: multiview_pcd_abs

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    pcd:
      shape: [4412, 6] 
      type: pcd
    robot0_eye_in_hand_image:
      shape: [3, 128, 128]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      # type default: low_dim
    robot0_eef_quat:
      shape: [4] #xyzw
    robot0_gripper_qpos:
      shape: [2]
  action: 
    shape: [10]

task_name: &task_name coffee_d2
dataset_type: &dataset_type long
dataset_root_path: &dataset_root_path "."
dataset_path: &dataset_path ${task.dataset_root_path}/${task_name}_multiview_abs.hdf5
abs_action: &abs_action True

env_runner:
  _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
  dataset_path: *dataset_path
  shape_meta: *shape_meta
  # costs 1GB per env
  n_train: 6
  n_train_vis: 1
  train_start_idx: 0
  n_test: 50
  n_test_vis: 3
  test_start_seed: 100000
  # use python's eval function as resolver, single-quoted string as argument
  max_steps: ${eval:'500 if "${task.dataset_type}" == "mh" else 400'}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: 'spaceview_image'
  fps: 10
  crf: 22
  past_action: ${past_action_visible}
  abs_action: *abs_action
  tqdm_interval_sec: 1.0
  n_envs: 28

dataset:
  _target_: diffusion_policy.dataset.simple_replay_pcd_dataset.SimpleReplayPCDDataset
  shape_meta: *shape_meta
  dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  abs_action: *abs_action
  rotation_rep: 'rotation_6d'
  use_legacy_normalizer: False
  use_cache: True
  seed: 42
  val_ratio: 0.02
  max_train_episodes: &max_train_episodes 200
  se2_augmentation: ${se2_augmentation}
  fix_point_num: ${fix_point_num}
  use_voxel: ${use_voxel}